name: Lineup checks

on:
  pull_request:
  push:
    branches: [main, 'fix/**', 'feat/**']

permissions:
  contents: read

concurrency:
  group: lineup-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high

  browser:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LINEUP_LOCAL_E2E: '1'
      RESEND_API_KEY: ''
      PLAYWRIGHT_MODULE: file:///tmp/lineup-browser/node_modules/playwright/index.mjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - run: npm ci
      - name: Start disposable local database
        shell: bash
        run: |
          supabase --help
          supabase init --help
          supabase start --help
          supabase status --help
          supabase db reset --help
          supabase init --yes
          python3 e2e/configure-local-db.py
          supabase start
          supabase db reset --local
          supabase status -o env > /tmp/lineup-db.env
          source /tmp/lineup-db.env
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "TEST_SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo 'NEXT_PUBLIC_SITE_URL=http://localhost:3001' >> "$GITHUB_ENV"
          container="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          test -n "$container"
          docker exec -i "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/changes/event_contact_privacy.sql
      - name: Seed local identities and run database regression checks
        shell: bash
        run: |
          node e2e/seed.mjs
          container="$(docker ps --filter name=supabase_db_ --format '{{.Names}}' | head -n 1)"
          { printf 'begin;\n'; cat supabase/tests/system_hardening.sql; printf '\nrollback;\n'; } | docker exec -i "$container" psql -U postgres -d postgres -v ON_ERROR_STOP=1
      - name: Install browser
        run: |
          npm install --prefix /tmp/lineup-browser --no-package-lock --ignore-scripts playwright@1.65.1
          node /tmp/lineup-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Build and exercise browser workflows
        shell: bash
        run: |
          npm run build
          npm run start > /tmp/lineup-server.log 2>&1 &
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3001/login > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node e2e/browser.mjs
      - name: Verify development-only dashboard preview
        shell: bash
        env:
          LINEUP_PREVIEW_TEST_URL: http://localhost:3002
        run: |
          node node_modules/next/dist/bin/next dev --port 3002 > /tmp/lineup-dev-server.log 2>&1 &
          ready=0
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3002/login > /dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" = 1
          node e2e/dev-preview.mjs
      - name: Print server log on failure
        if: failure()
        run: |
          cat /tmp/lineup-server.log 2>/dev/null || true
          cat /tmp/lineup-dev-server.log 2>/dev/null || true
      - name: Stop disposable database
        if: always()
        run: supabase stop --no-backup
